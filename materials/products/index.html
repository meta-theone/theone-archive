<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>상품 자료 · 더원사업단 자료실</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root{--charcoal:#1f2430;--gold:#c9a24b;--paper:#f5f6f8;--line:#e4e7ec;--muted:#6b7280;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:#1a1d24;line-height:1.6;}
    .wrap{max-width:960px;margin:0 auto;padding:0 20px;}
    header{background:var(--charcoal);color:#fff;padding:40px 0;}
    header .back{color:var(--gold);text-decoration:none;font-size:13px;font-weight:700;}
    header h1{font-size:26px;font-weight:900;margin-top:10px;}
    header p{color:#c7cdd6;font-size:14px;margin-top:6px;}
    main{padding:36px 0 70px;}
    .empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);}
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="back" href="../../">← 자료실 홈</a>
    <h1>🛡️ 상품 자료</h1>
    <p>상품 요약, 비교표, 설계 제안서 템플릿</p>
  </div></header>
  <main><div class="wrap">
    <div class="empty">아직 발행된 상품 자료가 없습니다.</div>
  </div></main>
</body>
</html>
